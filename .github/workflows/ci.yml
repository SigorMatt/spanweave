name: CI

on:
  push:
  pull_request:

# setup-uv resolves its version by fetching a manifest from
# raw.githubusercontent.com. That fetch is a known intermittent failure
# (astral-sh/setup-uv#849, #869). Passing github-token authenticates it.
# The token is provided automatically by Actions -- nothing to create.
# If this still flakes, drop the action entirely and use:
#     run: curl -LsSf https://astral.sh/uv/install.sh | sh
# and update ENVIRONMENT.md to match rather than leaving a stale reference.

jobs:
  check:
    runs-on: ubuntu-latest
    # The `otlp` extra is installed here, so the protobuf tests run on every
    # Python in the matrix, and SPANWEAVE_REQUIRE_OTLP makes a proto runtime
    # that will not import a failure rather than a skip that passes (cold
    # review of 2026-10-17, R-16). The sync below is ENVIRONMENT.md's Setup.
    env:
      SPANWEAVE_REQUIRE_OTLP: "1"
    strategy:
      fail-fast: false
      matrix:
        # A library that sits underneath other people's tools must not narrow
        # their runtime (ENVIRONMENT.md). This list and the `Programming
        # Language :: Python` classifiers in pyproject.toml are held equal by
        # `tests/test_acceptance.py`, because they drifted apart once and it
        # cost a whole release's worth of wrong documentation: every version
        # tested here happened to be one where `json.loads` and `json.dumps`
        # give out at the same depth, and the only version that diverges was
        # the one CI did not test and a local `uv run` picks (run-3 review F1).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        # Full history and tags: `tests/test_doc_truth.py` resolves every sha
        # a document cites with `git cat-file`, and the default depth-1 clone
        # holds one commit (cold review of 2026-10-17, R-13).
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        # @v8 / @v8.0 moving tags no longer resolve; pin a full version tag.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --extra dev --extra otlp --python ${{ matrix.python-version }}
      # make check wraps the exact toolchain commands (ruff, mypy, pytest)
      # plus the invariant gates and phase done-whens -- the acceptance
      # harness, task 0.8.
      - run: make check
      # make check runs everything under `uv run`, with the source tree on the
      # path -- so it can only answer questions about the repository. This is
      # the only gate that builds the distribution, installs the wheel into a
      # throwaway venv and runs it from outside the repo (TASKS.md 3.6). A
      # packaging break passes every other gate and fails for the first
      # stranger. It reaches PyPI only as the step above does, for
      # dependencies: ENVIRONMENT.md network zone 1. It never publishes.
      - run: make install-check

  otlp:
    # The `otlp` extra at its declared FLOORS (cold review of 2026-10-17,
    # R-18). The `check` matrix runs the protobuf tests against the lock's
    # versions; this job runs the whole suite -- the zoo's 29 pairs, the
    # census from the raw bodies -- against the lowest versions
    # pyproject.toml's `[otlp]` admits, so the minimums are tested rather
    # than suspected. `tests/test_acceptance.py` holds the pins below equal
    # to pyproject.toml's lower bounds, and this matrix equal to the check
    # job's: a floor is an interpreter-dependent claim (the previous pair,
    # `protobuf` 4.25 with `opentelemetry-proto` 1.27, passed on 3.11-3.13
    # and failed to import on 3.14). `uv run` re-syncs to the lock by
    # default and would silently put the lock's versions back, so every
    # `uv run` here is `--no-sync`, and a step prints and asserts the
    # versions the suite actually ran against.
    runs-on: ubuntu-latest
    env:
      SPANWEAVE_REQUIRE_OTLP: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --extra dev --extra otlp --python ${{ matrix.python-version }}
      - name: Install the floors over the lock
        run: uv pip install "protobuf==5.27.*" "opentelemetry-proto==1.28.*"
      - name: The floors are what is installed
        run: >-
          uv run --no-sync python -c "import importlib.metadata as m;
          v = {p: m.version(p) for p in ('protobuf', 'opentelemetry-proto')};
          print(v);
          assert v['protobuf'].startswith('5.27.'), v;
          assert v['opentelemetry-proto'].startswith('1.28.'), v"
      - run: uv run --no-sync mypy spanweave
      - run: uv run --no-sync pytest -rs

  determinism:
    # Determinism is a cross-machine claim (CLAUDE.md 4), so it is worth
    # proving on more than one OS rather than only on the machine that
    # generated the expected outputs.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --extra dev
      - run: make conformance
      - run: uv run pytest tests/test_determinism.py -v
